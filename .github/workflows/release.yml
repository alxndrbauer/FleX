name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract version name
        id: appversion
        run: echo "name=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        run: mkdir -p app/src/main/assets

      - uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4
        with:
          config: cliff.toml
          args: --tag "v${{ steps.appversion.outputs.name }}"
        env:
          OUTPUT: app/src/main/assets/changelog.md

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android.jks

      - name: Set up JDK 25
        uses: actions/setup-java@v6.1.0
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Run Unit Tests
        run: xvfb-run ./gradlew testDebugUnitTest

      - name: Build Release APK
        run: xvfb-run ./gradlew assembleRelease renameReleaseApk --no-daemon
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Generate version tag
        id: version
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="v${VERSION}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "name=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Determine release channel
        id: channel
        run: |
          VERSION="${{ steps.version.outputs.name }}"
          TAG="${{ steps.version.outputs.tag }}"
          if [[ "$VERSION" == *-beta* || "$TAG" == *-beta* ]]; then
            echo "is_beta=true" >> "$GITHUB_OUTPUT"
            echo "label=Beta" >> "$GITHUB_OUTPUT"
          else
            echo "is_beta=false" >> "$GITHUB_OUTPUT"
            echo "label=Release" >> "$GITHUB_OUTPUT"
          fi

      - name: Push tag (manual trigger only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG="${{ steps.version.outputs.tag }}"
          git tag -f "$TAG"
          git push origin "$TAG" --force

      - name: Create or Update Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.channel.outputs.label }} ${{ steps.version.outputs.tag }}
          prerelease: ${{ steps.channel.outputs.is_beta }}
          files: app/build/outputs/apk/release/renamed/*.apk
          generate_release_notes: true

      - name: Get release notes for manifest
        id: cliff_manifest
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4
        with:
          config: cliff.toml
          args: --latest --strip all

      - name: Update version manifest in Gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          IS_BETA: ${{ steps.channel.outputs.is_beta }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          TAG: ${{ steps.version.outputs.tag }}
          CHANGELOG: ${{ steps.cliff_manifest.outputs.content }}
        run: |
          set -euo pipefail
          VERSION_CODE=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts | head -1)
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/flex-v${VERSION_NAME}.apk"

          CHANNEL=$(jq -n \
            --argjson vc "$VERSION_CODE" \
            --arg vn "$VERSION_NAME" \
            --arg dl "$DOWNLOAD_URL" \
            --arg cl "$CHANGELOG" \
            '{versionCode: $vc, versionName: $vn, changelog: $cl, downloadUrl: $dl}')

          GIST=$(curl -sf -H "Authorization: token $GIST_TOKEN" \
            "https://api.github.com/gists/$GIST_ID")
          CURRENT=$(echo "$GIST" | jq -r '.files["version.json"].content // empty')
          if ! echo "$CURRENT" | jq -e . >/dev/null 2>&1; then
            echo "::error::version.json im Gist konnte nicht gelesen werden"
            exit 1
          fi

          if [ "$IS_BETA" = "true" ]; then
            # Stabilen Kanal unverändert lassen, nur Beta-Kanal ersetzen.
            UPDATED=$(echo "$CURRENT" | jq --argjson channel "$CHANNEL" '.beta = $channel')
          else
            # Stabilen Kanal ersetzen; Beta nur behalten, wenn er neuer ist.
            UPDATED=$(echo "$CURRENT" | jq --argjson channel "$CHANNEL" '
              ($channel + {
                beta: (if .beta != null and .beta.versionCode > $channel.versionCode
                       then .beta else null end)
              })
              | if .beta == null then del(.beta) else . end
            ')
          fi

          jq -n --arg content "$(echo "$UPDATED" | jq -c .)" \
            '{files: {"version.json": {content: $content}}}' \
          | curl -sf -X PATCH \
              -H "Authorization: token $GIST_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.github.com/gists/$GIST_ID" \
              --data-binary @-
